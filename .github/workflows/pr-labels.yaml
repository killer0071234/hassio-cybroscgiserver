---
name: PR Labels

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize

# Labels are often added right after a PR is opened (e.g. by Dependabot).
# Cancel the older run so the latest label state decides the check result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflows:
    uses: hassio-addons/workflows/.github/workflows/pr-labels.yaml@adec4b96071354cc44924a6ef9975ff60cf9ddd9 # v5.0.0
